[project]
name = "docuflow"
version = "0.1.0"
description = "DocuFlow AI — PDF processing SaaS backend, worker, and processing engines"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "DocuFlow AI" }]
dependencies = [
    "fastapi>=0.115.0,<0.129.0",
    "uvicorn[standard]>=0.32.0,<0.40.0",
    "sqlalchemy>=2.0.36,<2.1",
    "alembic>=1.14.0,<1.18",
    "psycopg[binary]>=3.2.0,<3.3",
    "pydantic>=2.10.0,<3",
    "pydantic-settings>=2.6.0,<3",
    "python-multipart>=0.0.12,<1",
    "argon2-cffi>=23.1.0,<26",
    "itsdangerous>=2.2.0,<3",
    "email-validator>=2.2.0,<3",
    "redis>=5.2.0,<7",
    "rq>=2.1.0,<3",
    "pypdf>=5.1.0,<7",
    "pymupdf>=1.24.14,<1.27",
    "pillow>=11.0.0,<12",
    "pdfplumber>=0.11.4,<0.12",
    "python-docx>=1.1.2,<2",
    "openpyxl>=3.1.5,<4",
    "pdf2docx>=0.5.8,<0.6",
    "boto3>=1.35.0,<2",
    "httpx>=0.27.0,<0.29",
    "orjson>=3.10.0,<4",
    "python-json-logger>=3.2.0,<4",
    "stripe>=11.0.0,<15",
    "cryptography>=44.0.0,<47",
    "pytesseract>=0.3.13,<0.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0,<9",
    "pytest-asyncio>=0.24.0,<1.3",
    "pytest-cov>=6.0.0,<8",
    "fakeredis>=2.26.0,<3",
    "ruff>=0.8.0,<0.15",
    "mypy>=1.13.0,<2",
    "types-redis>=4.6.0",
]

[project.scripts]
docuflow-api = "docuflow.main:run"
docuflow-worker = "docuflow.worker:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/docuflow"]

[tool.hatch.build.targets.wheel.sources]
"src/docuflow" = "docuflow"

[tool.hatch.build.targets.sdist]
include = ["src/docuflow", "alembic", "alembic.ini", "README.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    "ignore::DeprecationWarning",
]
markers = [
    "integration: tests that need postgres/redis",
    "slow: slower processing tests",
]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "ASYNC", "S"]
ignore = [
    "S101",  # asserts in tests
    "S104",  # bind 0.0.0.0 in uvicorn
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S107", "S311"]
"src/docuflow/pdf/**" = ["S324"]
"src/docuflow/api/**" = ["B008"]

[tool.mypy]
python_version = "3.12"
pretty = true
packages = ["docuflow"]
mypy_path = "src"
ignore_missing_imports = true
warn_unused_ignores = false
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true

[tool.coverage.run]
source = ["src/docuflow"]
branch = true
omit = ["src/docuflow/alembic_env.py"]

[tool.coverage.report]
fail_under = 0
show_missing = true
