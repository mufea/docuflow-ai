# Optional queue-based scaling overlay for DocuFlow AI.
#
# This is NOT the default Render Blueprint. Do not point a Blueprint at this
# file. Copy the worker service (and the JOB_BROKER=rq API change) into
# infra/render.yaml only when you are ready to pay for a background worker.
#
# Prerequisites:
#   - docuflow-redis already exists (Free Key Value in the default Blueprint)
#   - Set JOB_BROKER=rq on docuflow-api (replace value: inline)
#   - Same S3 credentials and DOCUFLOW_SECRET_KEY as the API
#
# Redis is then required. Inline execution remains the fallback if no RQ
# worker heartbeat is visible.

services:
  - type: worker
    name: docuflow-worker
    runtime: python
    # Render does not offer Free for background workers.
    plan: 0.5c-512mb
    buildCommand: pip install -r requirements.txt
    startCommand: python -m docuflow.worker
    envVars:
      - key: DOCUFLOW_ENV
        value: production
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: DATABASE_URL
        fromDatabase:
          name: docuflow-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: docuflow-redis
          type: redis
          property: connectionString
      - key: JOB_BROKER
        value: rq
      - key: RQ_QUEUE_NAME
        value: docuflow
      - key: STORAGE_BACKEND
        value: s3
      - key: S3_FORCE_PATH_STYLE
        value: "true"
      - key: LOG_JSON
        value: "true"
      - key: DOCUFLOW_SECRET_KEY
        fromService:
          name: docuflow-api
          type: web
          envVarKey: DOCUFLOW_SECRET_KEY
      - key: S3_BUCKET
        fromService:
          name: docuflow-api
          type: web
          envVarKey: S3_BUCKET
      - key: S3_ACCESS_KEY_ID
        fromService:
          name: docuflow-api
          type: web
          envVarKey: S3_ACCESS_KEY_ID
      - key: S3_SECRET_ACCESS_KEY
        fromService:
          name: docuflow-api
          type: web
          envVarKey: S3_SECRET_ACCESS_KEY
      - key: S3_ENDPOINT_URL
        fromService:
          name: docuflow-api
          type: web
          envVarKey: S3_ENDPOINT_URL
      - key: S3_REGION
        value: auto
      - key: AI_PROVIDER
        value: mock
      - key: OCR_ENABLED
        value: "true"
      - key: JOB_STALE_MINUTES
        value: "90"
      - key: CLEANUP_INTERVAL_SECONDS
        value: "0"
      - key: STORAGE_DELETE_MAX_ATTEMPTS
        value: "8"
      - key: STORAGE_DELETE_LEASE_MINUTES
        value: "5"
      - key: CLEANUP_LEASE_MINUTES
        value: "5"
      - key: WORKER_CONCURRENCY
        value: "2"
      - key: WORKER_TIMEOUT_SECONDS
        value: "300"
