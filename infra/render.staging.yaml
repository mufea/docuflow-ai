# Isolated STAGING Blueprint for DocuFlow AI.
#
# This file is a template. It does not deploy anything by itself.
# It is NOT a production configuration and is NOT proof that staging exists.
#
# Apply only after owner approval, and only in a dedicated Render workspace
# that does not already run docuflow-api / docuflow-db / docuflow-web.
# Render Free allows one Postgres instance per workspace. Putting this
# Blueprint in the same workspace as production can create paid resources
# or collide with production service names.
#
# Cost-efficient staging architecture:
#   staging web + staging API + staging Postgres + staging cleanup cron
#   JOB_BROKER=inline  — no paid worker, no Redis
#   Redis is unused while jobs are inline, so it is omitted here.
#   Production Redis in infra/render.yaml is unchanged.
#
# Cost is not zero. Confirm the live Render price list before applying:
#   - Free web services: spin-down, 750 instance hours/workspace/month.
#   - Free PostgreSQL: 1 GB, no managed backups, one per workspace,
#     expires 30 days after creation (then a paid plan is required).
#   - Cleanup cron is billed for the seconds it runs.
#   - External S3-compatible storage is billed by that provider.
# ipAllowList: [] keeps Postgres on the Render private network. Laptop
# migrate-verify needs an owner-added IP or a Render shell.
#
# Fill S3_* with a dedicated STAGING bucket (not the production bucket).
# The application has no global object-key prefix, so prefix isolation is
# not enough. Do not reuse production secrets.
#
# Do not apply this file automatically from an agent environment.

previewsEnabled: false

databases:
  - name: docuflow-staging-db
    plan: free
    postgresMajorVersion: 16
    ipAllowList: []

services:
  - type: web
    name: docuflow-staging-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python -m docuflow.migrate && uvicorn docuflow.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DOCUFLOW_ENV
        value: production
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: DATABASE_URL
        fromDatabase:
          name: docuflow-staging-db
          property: connectionString
      - key: JOB_BROKER
        value: inline
      - key: WORKER_TIMEOUT_SECONDS
        value: "300"
      - key: WORKER_CONCURRENCY
        value: "2"
      - key: STORAGE_BACKEND
        value: s3
      - key: S3_FORCE_PATH_STYLE
        value: "true"
      - key: COOKIE_SAMESITE
        value: lax
      - key: DOCUFLOW_PUBLIC_API_URL
        fromService:
          name: docuflow-staging-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: LOG_JSON
        value: "true"
      - key: COOKIE_SECURE
        value: "true"
      - key: DOCUFLOW_SECRET_KEY
        generateValue: true
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_ENDPOINT_URL
        sync: false
      - key: S3_REGION
        value: auto
      - key: DOCUFLOW_PUBLIC_WEB_URL
        fromService:
          name: docuflow-staging-web
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: DOCUFLOW_CORS_ORIGINS
        fromService:
          name: docuflow-staging-web
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: DOCUFLOW_TRUSTED_HOSTS
        value: .onrender.com
      - key: AI_PROVIDER
        value: mock
      - key: EMAIL_BACKEND
        value: console
      - key: OCR_ENABLED
        value: "true"
      - key: JOB_STALE_MINUTES
        value: "90"
      - key: CLEANUP_INTERVAL_SECONDS
        value: "0"
      - key: CLEANUP_LEASE_MINUTES
        value: "5"
      - key: STORAGE_DELETE_MAX_ATTEMPTS
        value: "8"
      - key: STORAGE_DELETE_LEASE_MINUTES
        value: "5"

  - type: cron
    name: docuflow-staging-cleanup
    runtime: python
    schedule: "*/15 * * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: python -m docuflow.migrate && python -m docuflow.cleanup
    envVars:
      - key: DOCUFLOW_ENV
        value: production
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: LOG_JSON
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: docuflow-staging-db
          property: connectionString
      - key: STORAGE_BACKEND
        value: s3
      - key: S3_FORCE_PATH_STYLE
        value: "true"
      - key: S3_REGION
        value: auto
      - key: S3_BUCKET
        fromService:
          name: docuflow-staging-api
          type: web
          envVarKey: S3_BUCKET
      - key: S3_ACCESS_KEY_ID
        fromService:
          name: docuflow-staging-api
          type: web
          envVarKey: S3_ACCESS_KEY_ID
      - key: S3_SECRET_ACCESS_KEY
        fromService:
          name: docuflow-staging-api
          type: web
          envVarKey: S3_SECRET_ACCESS_KEY
      - key: S3_ENDPOINT_URL
        fromService:
          name: docuflow-staging-api
          type: web
          envVarKey: S3_ENDPOINT_URL
      - key: JOB_STALE_MINUTES
        value: "90"
      - key: STORAGE_DELETE_MAX_ATTEMPTS
        value: "8"
      - key: STORAGE_DELETE_LEASE_MINUTES
        value: "5"
      - key: CLEANUP_LEASE_MINUTES
        value: "5"
      - key: WORKER_TIMEOUT_SECONDS
        value: "300"

  - type: web
    name: docuflow-staging-web
    runtime: node
    plan: free
    buildCommand: corepack pnpm install --frozen-lockfile && corepack pnpm --filter web build
    startCommand: corepack pnpm --filter web start -p $PORT
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: COREPACK_ENABLE_DOWNLOAD_PROMPT
        value: "0"
      - key: API_INTERNAL_URL
        fromService:
          name: docuflow-staging-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: DOCUFLOW_PUBLIC_API_URL
        fromService:
          name: docuflow-staging-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: NEXT_PUBLIC_API_BASE
        value: /v1
