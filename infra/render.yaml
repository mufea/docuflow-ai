# Render Blueprint for DocuFlow AI
# This file describes services. It is not proof of a successful deployment.
#
# Cost-efficient default (Phase 9.2; unchanged in 9.3):
#   web + API + Postgres + cleanup cron + optional Free Redis
#   JOB_BROKER=inline  — jobs run inside the API process
#   One Render Cron runs cleanup; the API in-process scheduler is disabled
#
# A paid background worker is NOT part of this default stack. Redis is kept
# because existing workspaces already have it and RQ remains the documented
# scaling path — it is unused while JOB_BROKER=inline. To add a queue worker
# later, see infra/render.scaling.yaml. Do not apply this file blindly to a
# live workspace that already has docuflow-worker; removing a service from a
# Blueprint can delete it on the next sync. Owner approval is required.
#
# Compute plans: web, Postgres, and Key Value use Render's Free tier.
# Syncing this Blueprint does not always downgrade an existing paid service.
#
# Isolated staging uses infra/render.staging.yaml in a separate Render
# workspace. Staging omits Redis because JOB_BROKER=inline does not use it.
# Do not sync the staging file into a workspace that already has
# docuflow-api / docuflow-db. Owner approval is required before applying it.
# This production Blueprint is unchanged: optional Free Redis remains.

previewsEnabled: false

databases:
  - name: docuflow-db
    plan: free
    postgresMajorVersion: 16
    ipAllowList: []

services:
  - type: redis
    name: docuflow-redis
    plan: free
    maxmemoryPolicy: noeviction
    ipAllowList: []

  - type: web
    name: docuflow-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    # Free web services reject preDeployCommand. Run migrations on boot instead.
    # python -m docuflow.migrate takes a Postgres advisory lock so replicas do not race.
    startCommand: python -m docuflow.migrate && uvicorn docuflow.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DOCUFLOW_ENV
        value: production
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: DATABASE_URL
        fromDatabase:
          name: docuflow-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: docuflow-redis
          type: redis
          property: connectionString
      - key: JOB_BROKER
        # Cost-efficient mode: API runs jobs inline. Set rq only with a paid worker
        # from infra/render.scaling.yaml.
        value: inline
      - key: RQ_QUEUE_NAME
        value: docuflow
      - key: WORKER_TIMEOUT_SECONDS
        value: "300"
      - key: WORKER_CONCURRENCY
        value: "2"
      - key: STORAGE_BACKEND
        value: s3
      - key: S3_FORCE_PATH_STYLE
        value: "true"
      - key: COOKIE_SAMESITE
        value: lax
      - key: DOCUFLOW_PUBLIC_API_URL
        fromService:
          name: docuflow-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: LOG_JSON
        value: "true"
      - key: COOKIE_SECURE
        value: "true"
      - key: DOCUFLOW_SECRET_KEY
        generateValue: true
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_ENDPOINT_URL
        sync: false
      - key: S3_REGION
        value: auto
      - key: DOCUFLOW_PUBLIC_WEB_URL
        fromService:
          name: docuflow-web
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: DOCUFLOW_CORS_ORIGINS
        fromService:
          name: docuflow-web
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: DOCUFLOW_TRUSTED_HOSTS
        # Add your custom domain here too, comma-separated, e.g. ".onrender.com,pdf.example.com"
        value: .onrender.com
      - key: AI_PROVIDER
        value: mock
      - key: EMAIL_BACKEND
        value: console
      - key: OCR_ENABLED
        value: "true"
      - key: JOB_STALE_MINUTES
        value: "90"
      - key: CLEANUP_INTERVAL_SECONDS
        # Cron is the single cleanup scheduler. Keep 0 so the Free API does not
        # run a redundant in-process loop. Set 900 only if the cron is omitted.
        value: "0"
      - key: CLEANUP_LEASE_MINUTES
        value: "5"
      - key: STORAGE_DELETE_MAX_ATTEMPTS
        value: "8"
      - key: STORAGE_DELETE_LEASE_MINUTES
        value: "5"

  - type: cron
    name: docuflow-cleanup
    runtime: python
    # Billed only while the job runs. Cleans expired files even when the Free API is asleep.
    schedule: "*/15 * * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: python -m docuflow.migrate && python -m docuflow.cleanup
    envVars:
      - key: DOCUFLOW_ENV
        value: production
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: LOG_JSON
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: docuflow-db
          property: connectionString
      - key: STORAGE_BACKEND
        value: s3
      - key: S3_FORCE_PATH_STYLE
        value: "true"
      - key: S3_REGION
        value: auto
      - key: S3_BUCKET
        fromService:
          name: docuflow-api
          type: web
          envVarKey: S3_BUCKET
      - key: S3_ACCESS_KEY_ID
        fromService:
          name: docuflow-api
          type: web
          envVarKey: S3_ACCESS_KEY_ID
      - key: S3_SECRET_ACCESS_KEY
        fromService:
          name: docuflow-api
          type: web
          envVarKey: S3_SECRET_ACCESS_KEY
      - key: S3_ENDPOINT_URL
        fromService:
          name: docuflow-api
          type: web
          envVarKey: S3_ENDPOINT_URL
      - key: JOB_STALE_MINUTES
        value: "90"
      - key: STORAGE_DELETE_MAX_ATTEMPTS
        value: "8"
      - key: STORAGE_DELETE_LEASE_MINUTES
        value: "5"
      - key: CLEANUP_LEASE_MINUTES
        value: "5"
      - key: WORKER_TIMEOUT_SECONDS
        value: "300"

  # Paid RQ worker is intentionally omitted. See infra/render.scaling.yaml.

  - type: web
    name: docuflow-web
    runtime: node
    plan: free
    # Do not run `corepack enable`: it unlinks /usr/bin/pnpm on Render's read-only FS.
    buildCommand: corepack pnpm install --frozen-lockfile && corepack pnpm --filter web build
    startCommand: corepack pnpm --filter web start -p $PORT
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: COREPACK_ENABLE_DOWNLOAD_PROMPT
        value: "0"
      - key: API_INTERNAL_URL
        fromService:
          name: docuflow-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: DOCUFLOW_PUBLIC_API_URL
        fromService:
          name: docuflow-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: NEXT_PUBLIC_API_BASE
        value: /v1
