name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python tests and checks
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: docuflow
          POSTGRES_PASSWORD: docuflow
          POSTGRES_DB: docuflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U docuflow -d docuflow_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgresql+psycopg://docuflow:docuflow@localhost:5432/docuflow_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python dependencies
        run: uv sync --frozen --extra dev
      - name: Unit tests
        run: uv run pytest -q -m "not integration"
      - name: PostgreSQL integration tests
        run: uv run pytest -q -m integration
      - name: Lint
        run: uv run ruff check src tests scripts
      - name: Typecheck
        run: uv run mypy src/docuflow

  web:
    name: Web lint, typecheck, tests, and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - name: Install web dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm --filter web lint
      - name: Typecheck
        run: pnpm --filter web typecheck
      - name: Tests
        run: pnpm --filter web test
      - name: Production build
        run: pnpm --filter web build
